      - ER Diagram: database/er-diagram.md
      - Key Entities: database/key-entities.md
  - 5. API Reference:
      - Overview: api/index.md
      - Authentication: api/authentication.md
      - Endpoints: api/endpoints.md
      - Schemas: api/schemas.md
      - Error Codes: api/error-codes.md
  - 6. Frontend:
      - Overview: frontend/index.md
      - Architecture: frontend/architecture.md
      - Pages and Components: frontend/pages-and-components.md
      - Maps and Real-time: frontend/maps-and-real-time.md
      - State Management: frontend/state-management.md
  - 7. Workflows:
      - Overview: workflows/index.md
