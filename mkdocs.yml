site_name: MvuviGo Technical Documentation
site_description: Technical documentation for the MvuviGo fisher safety and rescue coordination system
site_url: ""  
repo_name: mvuvigo-technical-documentation
repo_url: https://github.com/<org>/mvuvigo-technical-documentation
edit_uri: edit/main/docs/

theme:
  name: material
  language: en
  features:
    - navigation.sections
    - navigation.top
    - navigation.indexes
    - navigation.footer
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.action.edit
  palette:
    - scheme: default
      primary: indigo
      accent: teal
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: indigo
      accent: teal
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

plugins:
  - search

markdown_extensions:
  - admonition
  - attr_list
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.superfences

extra_css:
  - stylesheets/extra.css

nav:
  - Home: index.md
  - 1. Overview:
      - Overview: overview/index.md
      - System Overview: overview/system-overview.md
      - Key Features: overview/key-features.md
      - Technology Stack: overview/technology-stack.md
      - Architecture Principles: overview/architecture-principles.md
      - Scope and Status: overview/scope-and-status.md
  - 2. Architecture:
      - Overview: architecture/index.md
      - System Architecture: architecture/system-architecture.md
      - Component Diagram: architecture/component-diagram.md
      - Data Flow: architecture/data-flow.md
  - 3. Repository Structure:
      - Overview: repository/index.md
      - Backend Repo: repository/backend-repo.md
      - Frontend Repo: repository/frontend-repo.md
  - 4. Database Design:
